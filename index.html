<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Útmutató külföldi tulajdonú cégeknek a Cégkapu (Company Gate, Ungarisches Firmenportal) és az Ügyfélkapu+ használatához – magyarul, angolul és németül.">
<meta name="color-scheme" content="light dark">
<style>[hidden] { display: none !important; }</style>
<title>Cégkapu-útmutató</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@400;600;700&family=Piazzolla:wght@400;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
/* Elrendezés: ragadós fejléc + útvonaljelző, középen egy keskeny olvasóoszlop képernyőnként, éjkék lábléc.
   Arculat: viktoriawp.eu (egyetlen kiemelőszín, Playfair cím / Montserrat szöveg, 6px gomb, 20px kártya, árnyék csak a fejlécen). */
:root {
  --bg: #FFFFFF;
  --surface: #F0F0FF;      /* levendula – szekció/kártya háttér */
  --ink: #011111;          /* címsor */
  --text: #62636A;         /* szövegtörzs */
  --accent: #02023B;       /* éjkék – egyetlen kiemelőszín */
  --on-accent: #FFFFFF;
  --line: #DBDBDF;
  --footer-bg: #02023B;
  --footer-fg: #FFFFFF;
  --todo-bg: #FFF4CC;      /* kitöltendő helyőrző – csak szerkesztés idejére */
  --todo-fg: #5A4500;
  --header-shadow: 0 5px 10px rgba(0, 0, 0, .1);

  --font-display: "Playfair Display", Georgia, serif;
  --font-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --font-accent: "Piazzolla", Georgia, serif;

  --radius-btn: 6px;
  --radius-card: 20px;
  --col: 760px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07071F; --surface: #111140; --ink: #F3F3FF; --text: #B4B5C8;
    --accent: #D9D9FF; --on-accent: #02023B; --line: #2B2B5C;
    --footer-bg: #111140; --footer-fg: #F3F3FF;
    --todo-bg: #3A3110; --todo-fg: #FFE7A0;
    --header-shadow: 0 5px 10px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07071F; --surface: #111140; --ink: #F3F3FF; --text: #B4B5C8;
  --accent: #D9D9FF; --on-accent: #02023B; --line: #2B2B5C;
  --footer-bg: #111140; --footer-fg: #F3F3FF;
  --todo-bg: #3A3110; --todo-fg: #FFE7A0;
  --header-shadow: 0 5px 10px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--on-accent); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; color: var(--ink); margin: 0; text-wrap: balance; }
h1 { font-size: 48px; line-height: 1.25; }
h2 { font-size: 36px; line-height: 1.3; }
h3 { font-size: 22px; line-height: 1.35; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
strong { color: var(--ink); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ---------- Fejléc ---------- */
.header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg);
  box-shadow: var(--header-shadow);
}
.header__inner {
  max-width: 1260px; margin-inline: auto;
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.logo { font-family: var(--font-display); font-size: 24px; color: var(--ink); line-height: 1.2; }
.logo small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text); }
.langs { display: flex; gap: 4px; }
.langs button {
  font: 600 14px/1 var(--font-body); color: var(--ink);
  background: transparent; border: 2px solid transparent; border-radius: var(--radius-btn);
  padding: 8px 10px; cursor: pointer;
}
.langs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* ---------- Útvonaljelző ---------- */
.track { border-top: 1px solid var(--line); }
.track ol {
  list-style: none; margin: 0 auto; padding: 10px 20px;
  max-width: 1260px;
  display: flex; gap: 6px 22px; flex-wrap: wrap; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.track li { display: flex; align-items: center; gap: 8px; color: var(--text); opacity: .6; }
.track li .n {
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1.5px solid currentColor; font-size: 12px;
}
.track li.done { opacity: 1; }
.track li.current { opacity: 1; color: var(--accent); }
.track li.current .n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ---------- Tartalom ---------- */
main { padding-inline: 20px; padding-block: 56px 72px; }
.screen { max-width: var(--col); margin-inline: auto; display: grid; gap: 28px; }
.screen:focus { outline: none; }
.eyebrow { font-family: var(--font-accent); font-weight: 700; font-size: 19px; color: var(--accent); line-height: 1.3; }
.head { display: grid; gap: 10px; }
.lead { font-size: 18px; line-height: 1.65; }
.meta { font-size: 14px; font-weight: 600; color: var(--ink); }

.bullets { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.bullets li { padding-left: 22px; position: relative; }
.bullets li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.panel { background: var(--surface); border-radius: var(--radius-card); padding: 28px 30px; display: grid; gap: 10px; align-content: start; }
.panel h3 { font-size: 20px; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

.roles { display: grid; gap: 0; border-top: 1px solid var(--line); }
.role { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 6px 24px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.role dt { font-weight: 700; color: var(--ink); }
.role dd { margin: 0; }
.tag { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); vertical-align: 1px; }

.callout { border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; color: var(--ink); font-weight: 600; }

/* Térkép a nyitóképernyőn: az út négy állomása */
.route { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; counter-reset: r; }
.route > div { position: relative; padding: 18px 16px 0 0; border-top: 2px solid var(--accent); }
.route > div::before {
  content: ""; position: absolute; top: -7px; left: 0;
  width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
}
.route b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.route span { font-size: 14px; line-height: 1.5; display: block; }

/* Lépések */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 56px 1fr; gap: 4px 18px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.step:first-child { border-top: 1px solid var(--line); }
.step .num { font-family: var(--font-body); font-size: 34px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.step h3 { font-family: var(--font-body); font-size: 17px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; }
.step .body { display: grid; gap: 8px; min-width: 0; }
.step ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.step .note { font-size: 14px; font-style: italic; }
.step .group { grid-column: 1 / -1; }
.steps .divider { list-style: none; padding: 22px 0 6px; font-family: var(--font-accent); font-weight: 700; font-size: 17px; color: var(--accent); }
.path { font-weight: 600; color: var(--ink); background: var(--surface); padding: 2px 8px; border-radius: var(--radius-btn); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-weight: 600; font-size: 15px; }
.links a::after { content: "\00a0↗"; }

/* Választókártyák */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.choice { background: var(--surface); border-radius: var(--radius-card); padding: 28px 28px 30px; display: grid; gap: 14px; align-content: start; }
.choice .letter { font-family: var(--font-display); font-size: 44px; line-height: 1; color: var(--accent); }
.choice dl { margin: 0; display: grid; gap: 10px; }
.choice dt { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.choice dd { margin: 0; }
.choice .btn { justify-self: start; margin-top: 6px; }

.answers { display: grid; gap: 12px; }
.answer {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%; text-align: left;
  font: 600 18px/1.4 var(--font-body); color: var(--ink);
  background: var(--surface); border: 2px solid transparent; border-radius: var(--radius-card);
  padding: 20px 24px; cursor: pointer;
}
.answer:hover { border-color: var(--accent); }
.answer::after { content: "→"; color: var(--accent); font-size: 22px; }
.hint { font-size: 15px; }

/* Gombok */
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn {
  display: inline-block; padding: 15px 30px;
  border: 2px solid var(--accent); border-radius: var(--radius-btn);
  background: var(--accent); color: var(--on-accent);
  font: 700 14px/1 var(--font-body); text-transform: uppercase; letter-spacing: .02em;
  text-decoration: none; cursor: pointer;
}
.btn:hover { opacity: .88; }
.btn--ghost { background: transparent; color: var(--accent); }
.btn--ghost:hover { background: var(--accent); color: var(--on-accent); opacity: 1; }
.textbtn { background: none; border: 0; padding: 0; font: 700 15px/1.4 var(--font-body); color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Összegzés */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.checklist li { border-bottom: 1px solid var(--line); }
.checklist label { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; cursor: pointer; color: var(--ink); font-weight: 600; }
.checklist input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.checklist input:checked + span { text-decoration: line-through; color: var(--text); font-weight: 400; }
.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 99px; border: 1.5px solid var(--accent); color: var(--accent); }
dl { margin: 0; }
.datarow { display: grid; grid-template-columns: 1fr; gap: 0; padding: 6px 0; }
.datarow dt { font-size: 13px; font-weight: 600; color: var(--ink); }
.datarow dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.todo { background: var(--todo-bg); color: var(--todo-fg); padding: 1px 6px; border-radius: 4px; font-weight: 600; }

/* Fogalomtár */
.glossary { max-width: var(--col); margin: 56px auto 0; border-top: 1px solid var(--line); padding-top: 8px; }
.glossary summary { cursor: pointer; padding: 14px 0; font-family: var(--font-accent); font-weight: 700; font-size: 18px; color: var(--accent); }
.glossary dl { margin: 0 0 8px; display: grid; gap: 0; }
.glossary div { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: 4px 20px; padding: 10px 0; border-top: 1px solid var(--line); }
.glossary dt { font-weight: 700; color: var(--ink); }
.glossary dd { margin: 0; }

/* Lábléc */
footer { background: var(--footer-bg); color: var(--footer-fg); padding-inline: 20px; padding-block: 48px 36px; }
footer .inner { max-width: var(--col); margin-inline: auto; display: grid; gap: 18px; }
footer h2 { color: var(--footer-fg); font-size: 26px; }
footer a { color: var(--footer-fg); }
footer .contact { display: flex; flex-wrap: wrap; gap: 6px 28px; font-weight: 600; }
footer .small { font-size: 13px; opacity: .8; border-top: 1px solid rgba(255,255,255,.2); padding-top: 16px; }
footer .todo { color: var(--todo-fg); }

@media (max-width: 767px) {
  h1 { font-size: 32px; } h2 { font-size: 26px; } h3 { font-size: 19px; }
  main { padding-block: 36px 56px; }
  .lead { font-size: 17px; }
  .route { grid-template-columns: 1fr; }
  .route > div { border-top: 0; border-left: 2px solid var(--accent); padding: 0 0 18px 20px; }
  .route > div::before { top: 2px; left: -7px; }
  .role, .glossary div { grid-template-columns: 1fr; }
  .header__inner { flex-wrap: nowrap; gap: 10px; }
  .logo { font-size: 21px; min-width: 0; }
  .logo small { font-size: 10px; letter-spacing: .05em; }
  .langs button { padding: 8px 7px; }
  .step { grid-template-columns: 40px 1fr; gap: 4px 12px; }
  .step .num { font-size: 26px; }
  .panel, .choice { padding: 24px 22px; }
  .track ol { justify-content: flex-start; gap: 6px 14px; }
  .track li .t { display: none; }
  .track li.current .t { display: inline; }
}
@media print {
  .header, .track, .actions, .glossary summary { display: none !important; }
  .glossary { display: block; }
  main { padding: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .screen { animation: in .25s ease both; }
  @keyframes in { from { transform: translateY(6px); } to { transform: none; } }
}
</style>
</head>

/* ============================================================
   MŰKÖDÉS
   ============================================================ */
const SCREENS = ["start", "cegkapu", "ugyfelkapu", "kerdes", "igen", "nem", "ut-a", "ut-b", "kesz-igen", "kesz-a", "kesz-b"];
const STAGE = { start: -1, cegkapu: 0, ugyfelkapu: 1, kerdes: 2, nem: 2, igen: 3, "ut-a": 3, "ut-b": 3, "kesz-igen": 4, "kesz-a": 4, "kesz-b": 4 };

/* Nyelv: 1) a linkben megadott (#en, #de-ut-b), 2) a látogató korábbi választása,
   3) a böngésző nyelve, 4) angol. */
let lang = "en";
let unsure = false;
const checks = {};
try { Object.assign(checks, JSON.parse(localStorage.getItem("ckp-checks") || "{}")); } catch (e) {}
{
  let stored = null;
  try { stored = localStorage.getItem("ckp-lang"); } catch (e) {}
  const nav = (navigator.language || "").slice(0, 2).toLowerCase();
  lang = STR[stored] ? stored : STR[nav] ? nav : "en";
}

const S = () => STR[lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const val = v => /^\[.*\]$/.test(v) ? `<span class="todo">${esc(v)}</span>` : esc(v);

/* A hash formája: [nyelv-]képernyő, pl. #ut-b, #de, #de-ut-b */
function parseHash() {
  let h = location.hash.replace("#", "");
  let l = null;
  const m = h.match(/^([a-z]{2})(?:-(.+))?$/);
  if (m && STR[m[1]]) { l = m[1]; h = m[2] || "start"; }
  return { l, id: SCREENS.includes(h) ? h : "start" };
}
function current() {
  return parseHash().id;
}
function go(id) {
  const target = `${lang}-${id}`;
  if (location.hash.replace("#", "") === target) render(true);
  else location.hash = target;
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("ckp-lang", lang); } catch (e) {}
  try { history.replaceState(null, "", `#${lang}-${current()}`); } catch (e) {}
}

function linksHtml(links) {
  if (!links) return "";
  return `<div class="links">${links.map(([k, label]) => `<a href="${LINKS[k]}" target="_blank" rel="noopener">${label}</a>`).join("")}</div>`;
}
function stepHtml(s, n) {
  return `<li class="step">
    <span class="num" aria-hidden="true">${n}</span>
    <div class="body">
      <h3>${s.t}</h3>
      ${s.d ? `<p>${s.d}</p>` : ""}
      ${s.list ? `<ul>${s.list.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
      ${s.note ? `<p class="note">${s.note}</p>` : ""}
      ${linksHtml(s.links)}
    </div>
  </li>`;
}
const backBtn = to => `<button class="btn btn--ghost" data-go="${to}">← ${S().back}</button>`;
const head = (eyebrow, h, extra = "") => `<div class="head"><span class="eyebrow">${eyebrow}</span><h2 id="screen-title">${h}</h2>${extra}</div>`;

function routeSteps(route) {
  const s = S();
  if (route === "igen") return s.yesSteps;
  if (route === "a") return s.aSteps.concat(s.yesSteps);
  return s.bSteps;
}

const VIEWS = {
  start() {
    const s = S().start;
    return `<div class="head">
        <span class="eyebrow">${s.eyebrow}</span>
        <h1 id="screen-title">${s.h}</h1>
      </div>
      <p class="lead">${s.lead}</p>
      <div class="panel">
        <h3>${s.routeTitle}</h3>
        <div class="route">${s.route.map(([b, t]) => `<div><b>${b}</b><span>${t}</span></div>`).join("")}</div>
      </div>
      <div class="actions"><button class="btn" data-go="cegkapu">${s.btn} →</button><span class="meta">${s.meta}</span></div>`;
  },
  cegkapu() {
    const s = S().cegkapu;
    return `${head(s.eyebrow, s.h)}
      <ul class="bullets">${s.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
      <div class="pair">
        <div class="panel"><h3>${s.askT}</h3><p>${s.ask}</p></div>
        <div class="panel"><h3>${s.whyT}</h3><p>${s.why}</p></div>
      </div>
      <div class="head"><h3>${s.rolesT}</h3></div>
      <dl class="roles">${s.roles.map(([t, d, tag]) => `<div class="role"><dt>${t}${tag ? ` <span class="tag">${tag}</span>` : ""}</dt><dd>${d}</dd></div>`).join("")}</dl>
      <div class="actions">${backBtn("start")}<button class="btn" data-go="ugyfelkapu">${S().next} →</button></div>`;
  },
  ugyfelkapu() {
    const s = S().ugyfelkapu;
    return `${head(s.eyebrow, s.h)}
      <ul class="bullets">${s.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
      <p class="callout">${s.callout}</p>
      <div class="actions">${backBtn("cegkapu")}<button class="btn" data-go="kerdes">${S().next} →</button></div>`;
  },
  kerdes() {
    const s = S().kerdes;
    return `${head(s.eyebrow, s.h)}
      <div class="answers">
        <button class="answer" data-go="igen">${s.yes}</button>
        <button class="answer" data-go="nem">${s.no}</button>
        <button class="answer" data-go="nem" data-unsure="1">${s.unsure}</button>
      </div>
      <p class="hint">${s.hint}</p>
      <div class="actions">${backBtn("ugyfelkapu")}</div>`;
  },
  nem() {
    const s = S().nem;
    const card = (k, letter) => `<div class="choice">
        <span class="letter" aria-hidden="true">${letter}</span>
        <h3>${s[k].t}</h3>
        <dl>
          <div><dt>${s.what}</dt><dd>${s[k].what}</dd></div>
          <div><dt>${s.plus}</dt><dd>${s[k].plus}</dd></div>
          <div><dt>${s.minus}</dt><dd>${s[k].minus}</dd></div>
        </dl>
        <button class="btn" data-go="ut-${k}">${s[k].btn} →</button>
      </div>`;
    return `${head(s.eyebrow, s.h, unsure ? `<p class="hint">${s.unsureNote} <button class="textbtn" data-go="igen">${s.unsureLink}</button></p>` : "")}
      <div class="choices">${card("a", "A")}${card("b", "B")}</div>
      <div class="actions">${backBtn("kerdes")}</div>`;
  },
  igen() {
    const s = S().igen;
    return `${head(s.eyebrow, s.h)}
      <ol class="steps">${S().yesSteps.map((st, i) => stepHtml(st, i + 1)).join("")}</ol>
      <div class="panel"><h3>${s.altT}</h3><div><button class="btn btn--ghost" data-go="ut-b">${s.altBtn} →</button></div></div>
      <div class="actions">${backBtn("kerdes")}<button class="btn" data-go="kesz-igen">${S().toSummary} →</button></div>`;
  },
  "ut-a"() {
    const s = S().utA, A = S().aSteps, Y = S().yesSteps;
    return `${head(s.eyebrow, s.h)}
      <ol class="steps">
        <li class="divider">${s.part1}</li>
        ${A.map((st, i) => stepHtml(st, i + 1)).join("")}
        <li class="divider">${s.part2}</li>
        ${Y.map((st, i) => stepHtml(st, A.length + i + 1)).join("")}
      </ol>
      <div class="actions">${backBtn("nem")}<button class="btn" data-go="kesz-a">${S().toSummary} →</button></div>`;
  },
  "ut-b"() {
    const s = S().utB;
    return `${head(s.eyebrow, s.h)}
      <ol class="steps">${S().bSteps.map((st, i) => stepHtml(st, i + 1)).join("")}</ol>
      <div class="actions">${backBtn("nem")}<button class="btn" data-go="kesz-b">${S().toSummary} →</button></div>`;
  },
  kesz(route) {
    const s = S().kesz;
    const steps = routeSteps(route);
    const ours = `<p>${route === "b" ? s.oursB : s.ours}</p>`;
    return `${head(s.eyebrow, s.h, `<div><span class="chip">${s.routes[route]}</span></div>`)}
      <ul class="checklist">${steps.map((st, i) => {
        const id = `chk-${route}-${i}`;
        return `<li><label for="${id}"><input type="checkbox" id="${id}" ${checks[id] ? "checked" : ""}><span>${i + 1}. ${st.check}</span></label></li>`;
      }).join("")}</ul>
      <p class="hint">${s.checkHint}</p>
      <div class="pair">
        <div class="panel"><h3>${s.oursT}</h3>${ours}</div>
        <div class="panel"><h3>${s.contactT}</h3><p>${s.contactText}</p></div>
      </div>
      <div class="actions">
        ${backBtn(route === "igen" ? "igen" : "ut-" + route)}
        <button class="btn btn--ghost" data-go="kerdes">${S().otherRoute}</button>
        <button class="textbtn" data-go="start">${S().restart}</button>
      </div>`;
  }
};

function renderChrome() {
  const s = S();
  document.documentElement.lang = lang;
  document.title = s.docTitle;
  document.getElementById("logo").innerHTML = `${val(OFFICE.name)}<small>${s.logoSub}</small>`;
  document.querySelector(".track").setAttribute("aria-label", s.trackLabel);

  const langs = Object.keys(STR);
  const lb = document.getElementById("langs");
  lb.hidden = langs.length < 2;
  lb.innerHTML = langs.map(l => `<button data-lang="${l}" aria-pressed="${l === lang}" title="${STR[l].langName}">${l.toUpperCase()}</button>`).join("");

  const g = document.getElementById("glossary");
  const wasOpen = g.open;
  g.innerHTML = `<summary>${s.glossaryT}</summary><dl>${s.glossary.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join("")}</dl>`;
  g.open = wasOpen;

  document.getElementById("footer").innerHTML = `
    <h2>${s.footerT}</h2>
    <div class="contact"><span>${val(OFFICE.contactName)}</span><span>${val(OFFICE.email)}</span><span>${val(OFFICE.phone)}</span>${OFFICE.web ? `<a href="${OFFICE.web}" target="_blank" rel="noopener">${esc(OFFICE.web.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : ""}</div>
    <p class="small">${val(OFFICE.name)} · ${s.footerNote}</p>`;
}

function render(focus) {
  const id = current();
  const stage = STAGE[id];
  const el = document.getElementById("screen");
  el.innerHTML = id.startsWith("kesz-") ? VIEWS.kesz(id.slice(5)) : VIEWS[id]();
  document.getElementById("track").innerHTML = S().track.map((t, i) => {
    const cls = i < stage ? "done" : i === stage ? "current" : "";
    return `<li class="${cls}" ${i === stage ? 'aria-current="step"' : ""}><span class="n">${i < stage ? "✓" : i + 1}</span><span class="t">${t}</span></li>`;
  }).join("");
  if (focus) {
    window.scrollTo({ top: 0 });
    el.focus({ preventScroll: true });
  }
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) {
    if (g.dataset.go === "nem") unsure = !!g.dataset.unsure;
    go(g.dataset.go);
    return;
  }
  const l = e.target.closest("[data-lang]");
  if (l) {
    setLang(l.dataset.lang);
    renderChrome(); render(false);
  }
});
document.addEventListener("change", e => {
  if (e.target.matches(".checklist input")) {
    checks[e.target.id] = e.target.checked;
    try { localStorage.setItem("ckp-checks", JSON.stringify(checks)); } catch (err) {}
  }
});
window.addEventListener("hashchange", () => {
  const { l } = parseHash();
  if (l && l !== lang) { lang = l; renderChrome(); }
  render(true);
});

{
  const { l } = parseHash();
  if (l) lang = l;
}
renderChrome();
render(false);
</script>
